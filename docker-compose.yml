services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - pykes_net

  frontend:
    build:
      context: ./frontend
    expose:
      - "80"
    networks:
      - pykes_net

  backend:
    build:
      context: ./backend
    expose:
      - "4000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pykes_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pykes
      POSTGRES_PASSWORD: pykes
      POSTGRES_DB: pykes
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - pykes_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pykes -d pykes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - pykes_net

  minio:
    # Local-only stand-in for object storage. Opt-in via
    # `docker compose --profile local-storage up` (or by naming it directly,
    # e.g. `docker compose up postgres redis minio -d`) — a plain
    # `docker compose up` skips it, since production points S3_* at
    # Cloudflare R2 instead and never runs this container.
    profiles: ["local-storage"]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pykesadmin
      MINIO_ROOT_PASSWORD: pykessecret
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - pykes_net

networks:
  pykes_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
