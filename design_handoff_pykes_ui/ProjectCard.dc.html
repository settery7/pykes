<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div onClick="{{ project.onClick }}" style="background:oklch(0.22 0.014 55);border:1px solid oklch(0.33 0.016 55);border-radius:12px;padding:14px;display:flex;gap:12px;cursor:pointer;">
  <canvas ref="{{ project.canvasRef }}" width="160" height="160" style="{{ project.canvasStyle }}"></canvas>
  <div style="flex:1;min-width:0;">
    <div style="font-weight:700;font-size:14px;">{{ project.name }}</div>
    <sc-if value="{{ project.ownerName }}" hint-placeholder-val="{{ false }}">
      <div style="font-size:12px;color:oklch(0.54 0.014 70);margin-top:1px;">by {{ project.ownerName }}</div>
    </sc-if>
    <div style="font-size:13px;color:oklch(0.72 0.014 70);margin-top:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">{{ project.description }}</div>
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:oklch(0.72 0.16 150);margin-top:8px;">{{ project.stageLabel }}</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 180}, &quot;project&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;ProjectDisplay&quot;}}"></script>
</body>
</html>
